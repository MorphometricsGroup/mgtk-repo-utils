[project]
name = "mgtk-repo-utils-clone"
version = "0.1.0"
description = "mgtk-repo-utils tools: resolve and clone — a repository's registries of other repositories, mapped to their declared clones."
readme = { text = "The `resolve` and `clone` tools of mgtk-repo-utils. Install `mgtk-repo-utils` for the command.", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mgtk-repo-utils-core", "pyyaml>=6"]

[project.entry-points."mgtk_repo_utils.tools"]
resolve = "mgtk_repo_utils_clone:RESOLVE"
clone = "mgtk_repo_utils_clone:CLONE"

[tool.uv.sources]
mgtk-repo-utils-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgtk_repo_utils_clone"]
