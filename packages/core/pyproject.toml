[project]
name = "mgtk-repo-utils-core"
version = "0.1.0"
description = "Core of mgtk-repo-utils: configuration, reports, file listing, tool discovery."
readme = { text = "Core of mgtk-repo-utils. Install `mgtk-repo-utils` for the command and the tools.", content-type = "text/markdown" }
license = "Apache-2.0 AND ISC"  # ISC: the port of github-slugger in slug.py
license-files = ["LICENSE", "LICENSE-github-slugger"]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgtk_repo_utils"]
