[project]
name = "mgtk-repo-utils-link-check"
version = "0.1.0"
description = "mgtk-repo-utils tool: relative Markdown links and heading anchors."
readme = { text = "The `link-check` tool of mgtk-repo-utils. Install `mgtk-repo-utils` for the command.", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mgtk-repo-utils-core"]

[project.entry-points."mgtk_repo_utils.tools"]
link-check = "mgtk_repo_utils_link_check:TOOL_SPEC"

[tool.uv.sources]
mgtk-repo-utils-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgtk_repo_utils_link_check"]
