[project]
name = "mgtk-repo-utils-issues-view"
version = "0.1.0"
description = "mgtk-repo-utils tool: a generated view over file-based issues, with layout and frontmatter checks."
readme = { text = "The `issues-view` tool of mgtk-repo-utils. Install `mgtk-repo-utils` for the command.", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mgtk-repo-utils-core"]

[project.entry-points."mgtk_repo_utils.tools"]
issues-view = "mgtk_repo_utils_issues_view:TOOL_SPEC"

[tool.uv.sources]
mgtk-repo-utils-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgtk_repo_utils_issues_view"]
