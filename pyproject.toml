# The distribution a consumer installs: the `mgtk-repo-utils` command with
# `check` and `pin`, depending on every tool at the same commit (design section
# 1). The repository is also a pre-commit hook repository (.pre-commit-hooks.yaml).
[project]
name = "mgtk-repo-utils"
version = "0.1.0"
description = "Repository-maintenance tools several repositories need in the same form: an issue view, a freeze lint, a link checker, declared clones."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mgtk-repo-utils-core",
    "mgtk-repo-utils-issues-view",
    "mgtk-repo-utils-freeze-lint",
    "mgtk-repo-utils-link-check",
    "mgtk-repo-utils-clone",
    "pyyaml>=6",
]

[project.scripts]
mgtk-repo-utils = "mgtk_repo_utils_cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mgtk-repo-utils-core = { workspace = true }
mgtk-repo-utils-issues-view = { workspace = true }
mgtk-repo-utils-freeze-lint = { workspace = true }
mgtk-repo-utils-link-check = { workspace = true }
mgtk-repo-utils-clone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgtk_repo_utils_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
