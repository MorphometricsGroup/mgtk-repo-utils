name: release-please

# Releases follow the Conventional Commits merged into main (design section 12):
# release-please keeps a release pull request up to date with the next version
# (pyproject.toml, __init__.py, CHANGELOG.md); merging it creates the tag and the
# GitHub release. A token of a person or an app lets CI run on that pull request
# (GITHUB_TOKEN's own pull requests trigger no workflows).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The lock records the project's own version, so the release branch must
      # refresh it after release-please bumps pyproject.toml; CI installs with
      # --frozen and checks the lock on every other branch (ci.yml). The open
      # release pull request is looked up, since the action reports a `pr`
      # only when it created or changed one.
      - uses: actions/checkout@v4
        if: ${{ !steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        if: ${{ !steps.release.outputs.release_created }}
      - name: Refresh uv.lock on the release branch
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr list --state open --search 'head:release-please--' --json headRefName --jq '.[0].headRefName // empty')"
          [ -n "$branch" ] || { echo "no open release pull request"; exit 0; }
          git fetch --quiet origin "$branch"
          git checkout --quiet "$branch"
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh uv.lock for the release" -- uv.lock
            git push --quiet origin "$branch"
          fi
