name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The lock matches the project
        # A release pull request bumps the project's own version, which the lock
        # also records; its branch refreshes the lock itself (release-please.yml).
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        run: uv lock --check
      - name: Install the project
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run the test suite
        # node is needed only to regenerate the slug fixtures (scripts/dev), not here.
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -q

  check:
    # The repository's own tracker and links, checked with the working tree
    # rather than the pinned release, so a change to the generated output is
    # caught in the pull request that makes it (README, Issue tracking).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen mgtk-repo-utils check

  pip-install:
    # A pre-commit hook repository is installed with `pip install .` from its
    # standard metadata alone (design section 1, revision 5.3); this is the
    # path prek's uv does not exercise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv "$RUNNER_TEMP/fresh"
      - run: '"$RUNNER_TEMP/fresh/bin/pip" install --quiet .'
      - run: '"$RUNNER_TEMP/fresh/bin/mgtk-repo-utils" tools'

  names:
    # The denylist names what must never appear in this repository, so the list
    # itself is a secret of the repository, never a tracked file (design section 1).
    # A pull request from a fork has no secrets; the scan runs when it merges.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file against the denylist
        env:
          MGTK_REPO_UTILS_DENYLIST: ${{ secrets.MGTK_REPO_UTILS_DENYLIST }}
        run: python3 scripts/dev/scan_denylist.py
